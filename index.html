<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Feliz Dia das Mães 💖</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      text-align: center;
      color: #333;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin: 30px auto;
      max-width: 400px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    h1 {
      color: #e91e63;
    }

    .aluno {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h1>💐 Feliz Dia das Mães 💐</h1>

<div class="card">
  <img src="foto1.jpeg">
  <p>"Mãe, você é tudo pra mim. Te amo!"</p>
  <div class="aluno">– João</div>
</div>

<div class="card">
  <img src="foto2.jpeg">
  <p>"Obrigada por tudo que você faz por mim!"</p>
  <div class="aluno">– Maria</div>
</div>

<!-- Música -->
<audio autoplay loop controls>
  <source src="Fico Assim Sem Você.mpeg" type="audio/mpeg">
</audio>

</body>
</html>
